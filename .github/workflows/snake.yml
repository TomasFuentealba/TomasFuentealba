name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TomasFuentealba
          outputs: |
            dist/snake-light.svg?color_snake=#16a34a&color_dots=#ebedf0,#dcfce7,#86efac,#4ade80,#16a34a
            dist/snake-dark.svg?color_snake=#4ade80&color_dots=#161b22,#14532d,#166534,#15803d,#22c55e
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}